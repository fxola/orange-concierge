name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm --filter @orange-concierge/core test

      - name: Build
        run: pnpm build
