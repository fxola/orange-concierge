name: CI

on:
  workflow_dispatch:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm --filter @orange-concierge/core test

      - name: Build
        run: pnpm build

  operations-e2e:
    name: Operations E2E
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter ./apps/operations exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operations-e2e-artifacts
          path: |
            apps/operations/playwright-report
            apps/operations/test-results/e2e
          if-no-files-found: ignore
