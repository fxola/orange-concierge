services:
  web:
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  # Local LLM runtime. Model data persists in the ollama_data volume.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot model bootstrap. Web starts only after the chat and embedding models exist.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${AI_MODEL:-llama3.2} && ollama pull nomic-embed-text"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
